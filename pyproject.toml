[project]
name = "fok-research"
version = "0.1.0"
description = "Research project exploring Feeling-of-Knowing (FOK) in a language model's internal states"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FOK Research" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
    "transformers>=4.53",
    "datasets>=2.20",
]

[project.optional-dependencies]
# Heavy scientific dependencies pulled in on demand to keep the base install light.
analysis = ["umap-learn>=0.5"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fok"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
fok = "fok.cli:cli"
